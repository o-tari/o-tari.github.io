<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plate by Plate</title>
<meta name="description" content="A 30-day gym and nutrition coach: random full-body workouts with slow progression, desk mobility, fasting and food guidance, and progress tracking.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDF0F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1114" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plate by Plate">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/big-shoulders-display-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/big-shoulders-display-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-style:normal;font-weight:900;font-display:swap;src:url(fonts/big-shoulders-display-latin-900-normal.woff2) format("woff2")}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one 560px phone column, sticky header, fixed tab bar. The hero is a rubber-floor slab carrying this week's bumper plate (10 kg green, 15 yellow, 20 blue, 25 red). */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --surface-2:#F3F5F7; --ink:#14171B; --muted:#58616B; --line:#D5DBE1;
  --pad:#E3E7EB; --pad-2:#D2D8DF; --body:#CDD4DB; --iron:#2B3036; --steel:#B9C1C9;
  --floor:#1A1D21; --floor-2:#252A30; --floor-ink:#F2F4F6; --floor-muted:#A9B1BA; --floor-line:#3A4047;
  --fleck-a:#3E536A; --fleck-b:#4C6052; --fleck-c:#5F656C;
  --p05:#F2F4F6; --p10:#178A4C; --p15:#F3B707; --p20:#1F63D6; --p25:#D8312B;
  --p05-ink:#58616B; --p10-ink:#157A41; --p15-ink:#8A6900; --p20-ink:#1952B5; --p25-ink:#B4241E;
  --p05-on:#14171B; --p10-on:#FFFFFF; --p15-on:#211900; --p20-on:#FFFFFF; --p25-on:#FFFFFF;
  --wk:var(--p10); --wk-ink:var(--p10-ink); --wk-on:var(--p10-on);
  --warn:#B4470F; --warn-bg:#FFF0E6; --ok:#157A41; --mid:#8A6200;
  --btn:#14171B; --btn-ink:#FFFFFF; --scrim:rgba(12,14,17,.5); --lift:0 1px 2px rgba(20,23,27,.08),0 8px 24px rgba(20,23,27,.08);
  --font-display:"Big Shoulders Display","Big Shoulders","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r-s:5px; --r-m:9px; --r-l:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1114; --surface:#171A1E; --surface-2:#1F2328; --ink:#ECEFF2; --muted:#9BA4AE; --line:#2C3238;
    --pad:#2A2F35; --pad-2:#363C43; --body:#353B42; --iron:#545C65; --steel:#8E969F;
    --floor:#1C2025; --floor-2:#272C32; --floor-ink:#F2F4F6; --floor-muted:#A9B1BA; --floor-line:#3D444C;
    --fleck-a:#3E536A; --fleck-b:#4C6052; --fleck-c:#5F656C;
    --p05:#E8EBEE; --p10:#2BB868; --p15:#F6C324; --p20:#3F7DF2; --p25:#EF4B43;
    --p05-ink:#B9C1C9; --p10-ink:#4FD488; --p15-ink:#F6C324; --p20-ink:#83AAFF; --p25-ink:#FF7D75;
    --p05-on:#14171B; --p10-on:#05200F; --p15-on:#211900; --p20-on:#FFFFFF; --p25-on:#FFFFFF;
    --warn:#FF9C5E; --warn-bg:#2C1B11; --ok:#4FD488; --mid:#F2C14E;
    --btn:#ECEFF2; --btn-ink:#14171B; --scrim:rgba(0,0,0,.6); --lift:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1114; --surface:#171A1E; --surface-2:#1F2328; --ink:#ECEFF2; --muted:#9BA4AE; --line:#2C3238;
  --pad:#2A2F35; --pad-2:#363C43; --body:#353B42; --iron:#545C65; --steel:#8E969F;
  --floor:#1C2025; --floor-2:#272C32; --floor-ink:#F2F4F6; --floor-muted:#A9B1BA; --floor-line:#3D444C;
  --fleck-a:#3E536A; --fleck-b:#4C6052; --fleck-c:#5F656C;
  --p05:#E8EBEE; --p10:#2BB868; --p15:#F6C324; --p20:#3F7DF2; --p25:#EF4B43;
  --p05-ink:#B9C1C9; --p10-ink:#4FD488; --p15-ink:#F6C324; --p20-ink:#83AAFF; --p25-ink:#FF7D75;
  --p05-on:#14171B; --p10-on:#05200F; --p15-on:#211900; --p20-on:#FFFFFF; --p25-on:#FFFFFF;
  --warn:#FF9C5E; --warn-bg:#2C1B11; --ok:#4FD488; --mid:#F2C14E;
  --btn:#ECEFF2; --btn-ink:#14171B; --scrim:rgba(0,0,0,.6); --lift:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
.wk0{--wk:var(--p05);--wk-ink:var(--p05-ink);--wk-on:var(--p05-on)}
.wk1{--wk:var(--p10);--wk-ink:var(--p10-ink);--wk-on:var(--p10-on)}
.wk2{--wk:var(--p15);--wk-ink:var(--p15-ink);--wk-on:var(--p15-on)}
.wk3{--wk:var(--p20);--wk-ink:var(--p20-ink);--wk-on:var(--p20-on)}
.wk4{--wk:var(--p25);--wk-ink:var(--p25-ink);--wk-on:var(--p25-on)}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
h1,h2,h3,h4{text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding-left:20px}
:focus-visible{outline:2.5px solid var(--wk-ink);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;height:54px}
.brand{display:flex;align-items:center;gap:8px;font:800 20px/1 var(--font-display);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.brand svg{width:22px;height:22px}
.topr{display:flex;align-items:center;gap:10px}
.daychip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font:800 15px/1 var(--font-display);letter-spacing:.07em;white-space:nowrap}
.daychip i{width:10px;height:10px;border-radius:50%;background:var(--wk);display:block}
.sync{width:9px;height:9px;border-radius:50%;background:var(--muted);border:0;padding:0;cursor:pointer}
.sync.ok{background:var(--ok)} .sync.busy{background:var(--mid)} .sync.local{background:var(--muted)}

/* layout */
.view{padding-top:6px;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:30px}
.view:focus{outline:none}
.sec{display:grid;gap:12px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sh h2{font:800 23px/1.05 var(--font-display);letter-spacing:.04em;text-transform:uppercase;margin:0}
.eyebrow{font:700 13px/1.2 var(--font-display);letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.fine{font-size:14px;color:var(--muted);line-height:1.45}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}

/* icons + buttons */
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ic .fl{fill:currentColor;stroke:none}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r-m);border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:700 16px/1.1 var(--font-body);cursor:pointer;text-align:center;transition:transform .12s ease,background-color .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.go{background:var(--wk);border-color:var(--wk);color:var(--wk-on)}
.btn.quiet{border-color:var(--line);background:var(--surface)}
.btn.onfloor{border-color:var(--floor-line);color:var(--floor-ink);background:transparent}
.btn.sm{min-height:38px;padding:0 13px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.ibtn{appearance:none;width:44px;height:44px;flex:none;display:inline-grid;place-items:center;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;padding:0}
.ibtn.sm{width:36px;height:36px}
.ibtn:active{transform:scale(.95)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;min-height:40px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 14px/1 var(--font-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 10px;border-radius:999px;background:var(--surface-2);font:700 13px/1.25 var(--font-body);color:var(--ink)}
.tag.wkt{background:var(--wk);color:var(--wk-on)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.link{appearance:none;background:none;border:0;padding:0;color:var(--ink);font:700 15px var(--font-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabsin{display:grid;grid-template-columns:repeat(5,1fr);height:62px}
.tab{appearance:none;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 11.5px/1 var(--font-body);color:var(--muted);cursor:pointer;position:relative;padding:0}
.tab .ic{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--wk)}

/* hero */
.hero{position:relative;border-radius:var(--r-l);color:var(--floor-ink);background-color:var(--floor);padding:18px;display:grid;gap:16px;overflow:hidden;
  background-image:radial-gradient(circle,var(--fleck-a) 0 1px,transparent 1.6px),radial-gradient(circle,var(--fleck-b) 0 1px,transparent 1.6px),radial-gradient(circle,var(--fleck-c) 0 .9px,transparent 1.5px);
  background-size:23px 19px,31px 27px,13px 17px;background-position:0 0,7px 11px,3px 5px}
.herotop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.bigplate{width:126px;height:126px;display:block}
.pl-rub{fill:var(--wk)} .pl-ring{fill:none;stroke:var(--wk-on);stroke-opacity:.22;stroke-width:1.5}
.pl-txt{font:800 14.5px var(--font-display);letter-spacing:.12em;fill:var(--wk-on);fill-opacity:.85}
.pl-num{font:900 24px var(--font-display);fill:var(--wk-on);text-anchor:middle;dominant-baseline:middle}
.pl-hub{fill:var(--steel)} .pl-hub2{fill:none;stroke:var(--iron);stroke-opacity:.35;stroke-width:2} .pl-hole{fill:var(--floor)}
.spin .pl-spin{transform-origin:100px 100px;animation:spin 1.3s cubic-bezier(.2,.75,.2,1) both}
@keyframes spin{from{transform:rotate(-140deg)}to{transform:rotate(0)}}
.herolabel{font:700 13px/1.2 var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--floor-muted)}
.dayno{font:900 86px/.8 var(--font-display);letter-spacing:0;margin:6px 0 8px;font-variant-numeric:tabular-nums}
.dayno small{font-size:24px;font-weight:800;color:var(--floor-muted);letter-spacing:.06em;margin-left:4px}
.wkpill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--wk);color:var(--wk-on);font:800 14px/1 var(--font-display);letter-spacing:.09em;text-transform:uppercase}
.mission{background:var(--floor-2);border-radius:var(--r-m);padding:14px;display:grid;gap:10px}
.mission h3{font:800 26px/1 var(--font-display);text-transform:uppercase;letter-spacing:.03em;margin:0}
.mission p{color:var(--floor-muted);font-size:15px}
.mission .row .btn{flex:1 1 auto}
.exnames{font-size:15px;color:var(--floor-ink);line-height:1.45}

/* coach note */
.note{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start}
.whistle{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center}
.note .who{font:700 13px/1.2 var(--font-display);letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}

/* habit tiles */
.habits{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hab{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:12px;display:grid;gap:9px;min-width:0;align-content:start}
.habh{display:flex;align-items:center;gap:7px;font:700 13px/1.2 var(--font-display);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.habh .ic{width:17px;height:17px}
.habv{font:800 30px/1 var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.habv small{font:700 13px var(--font-body);color:var(--muted);margin-left:3px}
.hab.full .habh{color:var(--wk-ink)}
.bar{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--wk);transition:width .35s ease}
.habb{display:flex;gap:6px}
.habb .btn{flex:1;min-height:38px;padding:0 6px;font-size:14px}

/* week strip */
.wkstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:grid;justify-items:center;gap:3px;padding:8px 0 7px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);font:700 11px/1 var(--font-body);color:var(--muted);min-width:0}
.wd b{font:800 19px/1 var(--font-display);color:var(--ink)}
.wd .ic{width:15px;height:15px}
.wd.today{border:2px solid var(--ink)}
.wd.gymdone,.wd.movedone{background:var(--wk);border-color:var(--wk);color:var(--wk-on)}
.wd.gymdone b,.wd.movedone b{color:var(--wk-on)}
.wd.missed{opacity:.55}
.wd.out{opacity:.35}

.tip{display:grid;gap:6px;border-left:3px solid var(--wk);padding:2px 0 2px 14px}
.tip p{font-size:17px;line-height:1.5}

/* train */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{appearance:none;border:0;background:transparent;border-radius:999px;min-height:40px;font:700 14px var(--font-body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--lift)}
.planhead{display:grid;gap:8px}
.planhead h2{font:900 40px/.95 var(--font-display);text-transform:uppercase;margin:0;letter-spacing:.01em}
.blkh{display:flex;align-items:center;gap:10px;font:800 17px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase}
.blkh .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font:800 14px/1 var(--font-display);letter-spacing:0}
.blkh .fine{text-transform:none;letter-spacing:0;font-weight:400;font-family:var(--font-body)}
.exlist{display:grid;gap:10px}
.excard{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:8px 10px 8px 6px;cursor:pointer;text-align:left;width:100%;appearance:none;color:var(--ink)}
.excard .eq{width:104px}
.excard h3{font:800 21px/1.02 var(--font-display);text-transform:uppercase;letter-spacing:.02em;margin:3px 0 5px}
.excard .slot{font:700 12px/1 var(--font-display);letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.excard .rx{font-size:14px;color:var(--muted);line-height:1.35}
.roll .excard{animation:roll .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 70ms)}
@keyframes roll{from{transform:translateY(10px) rotateX(70deg);opacity:0}to{transform:none;opacity:1}}
.mini{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mini:first-child{border-top:0}
.mini .eq{width:84px}
.mini b{font:800 18px/1.1 var(--font-display);text-transform:uppercase;letter-spacing:.03em;display:block}
.movelist{display:flex;flex-wrap:wrap;gap:6px}
.lib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.libi{appearance:none;display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:8px 10px 12px;text-align:left;cursor:pointer;color:var(--ink);min-width:0}
.libi b{font:800 17px/1.05 var(--font-display);text-transform:uppercase;letter-spacing:.02em}
.libi.locked{opacity:.55}
.rcard{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center}
.rcard h3{font:800 24px/1 var(--font-display);text-transform:uppercase;margin:0 0 4px}

/* overlay + sheets */
.layer{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pl-top{position:sticky;top:0;z-index:3;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.pl-topin{display:flex;align-items:center;gap:12px;height:58px}
.pl-prog{display:flex;gap:3px;flex:1;min-width:0}
.pl-prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.pl-prog i.on{background:var(--wk)} .pl-prog i.cur{background:var(--ink)}
.pl-time{font:800 17px/1 var(--font-display);letter-spacing:.06em;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.pl-body{padding-top:16px;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));display:grid;gap:18px}
.pl-foot{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.pl-footin{display:flex;gap:10px;padding-top:10px;padding-bottom:10px}
.pl-footin .btn{flex:1}
.exname{font:900 42px/.92 var(--font-display);text-transform:uppercase;letter-spacing:.01em;margin:4px 0 0}
.exhero{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:10px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:12px}
.mm{width:100%;height:auto;display:block}
.mm .mn *{fill:var(--body);stroke:none}
.mm .mp *{fill:var(--wk);stroke:none}

const { ART, muscleMap, eqSvg, f1 } = (() => {
/* ---------- Equipment line drawings (side/front views, 200x140, ground at y=130) ---------- */
const f1 = n => Math.round(n * 10) / 10;
const L = (x1, y1, x2, y2, k) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"${k ? ` class="${k}"` : ''}/>`;
const R = (x, y, w, h, r, k) => `<rect x="${x}" y="${y}" width="${w}" height="${h}"${r ? ` rx="${r}"` : ''}${k ? ` class="${k}"` : ''}/>`;
const C = (x, y, r, k) => `<circle cx="${x}" cy="${y}" r="${r}"${k ? ` class="${k}"` : ''}/>`;
const E = (x, y, rx, ry, k) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"${k ? ` class="${k}"` : ''}/>`;
const P = (d, k) => `<path d="${d}"${k ? ` class="${k}"` : ''}/>`;
/* upholstered pad: ink outline + fill stroke */
const PAD = (x1, y1, x2, y2, w = 10, k = '') =>
  `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="po" style="stroke-width:${w + 4}"/>` +
  `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${k === 'hl' ? 'pa' : 'pi'}" style="stroke-width:${w}"/>`;
const AR = (x1, y1, x2, y2) => {
  const a = Math.atan2(y2 - y1, x2 - x1), h = 8, s = 0.55;
  return `<line x1="${x1}" y1="${y1}" x2="${f1(x2 - 3 * Math.cos(a))}" y2="${f1(y2 - 3 * Math.sin(a))}" class="mv"/>` +
    `<path d="M${f1(x2 - h * Math.cos(a - s))},${f1(y2 - h * Math.sin(a - s))} L${x2},${y2} L${f1(x2 - h * Math.cos(a + s))},${f1(y2 - h * Math.sin(a + s))}" class="mvh"/>`;
};
const ARC = (cx, cy, r, a1, a2) => {
  const rad = d => d * Math.PI / 180;
  const x1 = cx + r * Math.cos(rad(a1)), y1 = cy + r * Math.sin(rad(a1));
  const x2 = cx + r * Math.cos(rad(a2)), y2 = cy + r * Math.sin(rad(a2));
  const sweep = a2 > a1 ? 1 : 0, large = Math.abs(a2 - a1) > 180 ? 1 : 0;
  const ta = rad(a2) + (sweep ? 1 : -1) * Math.PI / 2, h = 8, s = 0.55;
  return `<path d="M${f1(x1)},${f1(y1)} A${r},${r} 0 ${large} ${sweep} ${f1(x2)},${f1(y2)}" class="mv"/>` +
    `<path d="M${f1(x2 - h * Math.cos(ta - s))},${f1(y2 - h * Math.sin(ta - s))} L${f1(x2)},${f1(y2)} L${f1(x2 - h * Math.cos(ta + s))},${f1(y2 - h * Math.sin(ta + s))}" class="mvh"/>`;
};
const G = () => L(8, 130, 192, 130, 'gd');
/* selectorized weight stack with guide rods and pin */
const STACK = (x, top, w, plates) => {
  const h = plates * 6;
  let s = L(x + 3, top, x + 3, 128, 'thin') + L(x + w - 3, top, x + w - 3, 128, 'thin') + L(x, top, x + w, top);
  s += R(x, 128 - h, w, h, 1.5, 'stk');
  for (let i = 1; i < plates; i++) s += L(x + 1.5, 128 - i * 6, x + w - 1.5, 128 - i * 6, 'sl');
  s += R(x, 128 - h - 10, w, 5, 1.5, 'stk') + C(x + w + 3, 128 - h + 9, 2.4, 'pin');
  return s;
};

    for (const c of COLS) for (const [id, doc] of Object.entries(d[c] || {})) if (doc && typeof doc === 'object') put(c, id, doc);
    S.ui.sheet = null; S.ui.tab = 'today'; S.ui.spun = false; saveUi(); render(true); window.scrollTo(0, 0); toast('Backup restored');
  },
  ask: () => { const el = $('#ask-in'); const v = el ? el.value : ''; if (el) el.value = ''; askCoach(v); },
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const fn = ACT[a.dataset.act]; if (!fn) return;
  e.preventDefault(); unlockAudio();
  try { fn(a, e); } catch (err) { console.error(err); toast('Something went wrong. Try that again.'); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'ask-in') { e.preventDefault(); FORMS.ask(); }
  if (e.key === 'Escape' && S.ui.sheet && S.ui.sheet.type !== 'rest') { S.ui.sheet = null; renderLayer(); }
});
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); unlockAudio(); FORMS[f.dataset.form] && FORMS[f.dataset.form](f); });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'rs-file' && el.files && el.files[0]) { const fr = new FileReader(); fr.onload = () => { const ta = $('#rs-in'); if (ta) ta.value = String(fr.result || ''); }; fr.readAsText(el.files[0]); return; }
  if (el.dataset && el.dataset.set) {
    const s = curSession(); if (!s) return;
    const [i, j, k] = el.dataset.set.split('.'); const c = clone(s); const z = c.items[Number(i)] && c.items[Number(i)].sets[Number(j)]; if (!z) return;
    z[k] = numOrNull(el.value); put('sessions', c.id, c);
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'ask-in') { S.ui.draft = e.target.value; e.target.style.height = 'auto'; e.target.style.height = Math.min(150, e.target.scrollHeight) + 'px'; }
});

/* ========== backup ========== */
const backupJson = () => JSON.stringify({ app: 'plate-by-plate', v: 1, exportedAt: new Date().toISOString(), profile: S.profile, days: S.days, sessions: S.sessions, weights: S.weights, fasts: S.fasts });
function askPersist() { try { if (!HOSTED && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* ignore */ } }

/* ========== boot ========== */
function boot(hot) {
  loadLocal(); loadUi(); loadChat();
  if (hot && hot.ui) { try { const u = hot.ui; ['tab', 'seg', 'overlay', 'timers', 'meal'].forEach(k => { if (u[k] !== undefined) S.ui[k] = u[k]; }); } catch (e) { /* ignore */ } }
  if (S.profile) S.ready = true;
  S.day = today();
  render(true);
  initDb(); initSample();
  if (!HOSTED && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (S.profile) askPersist();
  setInterval(tick, 250);
  setInterval(() => { if (S.day !== today()) { S.day = today(); S.ui.spun = false; S.ui.anyway = false; render(); } }, 30000);
}
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ ui: { tab: S.ui.tab, seg: S.ui.seg, overlay: S.ui.overlay, timers: S.ui.timers, meal: S.ui.meal } })); } catch (e) { /* ignore */ }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});

</script>
